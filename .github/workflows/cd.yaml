name: Continuous Deployment (CD)

on:
  push:
    branches: [ master ]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  CD-Deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Execute Cloud Infra Deployment
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve -lock-timeout=10m

      - name: Connect to AKS Cluster
        uses: azure/aks-set-context@v4
        with:
          resource-group: 'rg-cloudmaven-secure'
          cluster-name: 'aks-cloudmaven-cluster'

      - name: Log into Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Microservices
        run: |
          docker build -f ./app/frontend/Dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/local-frontend:latest ./app/frontend
          docker build -f ./app/backend/Dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/local-backend:latest ./app/backend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/local-frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/local-backend:latest

      - name: Install NGINX Ingress Controller
        run: |
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update
          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            --namespace ingress-basic --create-namespace \
            --set controller.service.externalTrafficPolicy=Local \
            --atomic
  
      - name: Install Monitoring Stack (Prometheus & Grafana)
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
            --namespace monitoring --create-namespace \
            -f ./helm/monitoring-values.yaml \
            --atomic --wait --timeout 20m

      - name: Deploy Application via Helm
        run: |
          helm upgrade --install cloudmaven-app ./helm/myapp \
            --namespace core-apps --create-namespace \
            --set frontend.image.repository=${{ secrets.DOCKERHUB_USERNAME }}/local-frontend \
            --set backend.image.repository=${{ secrets.DOCKERHUB_USERNAME }}/local-backend \
            --set frontend.image.tag=latest \
            --set backend.image.tag=latest \
            --wait --timeout 5m
 
      - name: Smoke Test API
        run: |
          EXTERNAL_IP=$(kubectl get svc -n ingress-basic ingress-nginx-controller -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          curl --retry 5 --retry-connrefused http://$EXTERNAL_IP/api/health
