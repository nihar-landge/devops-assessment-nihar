name: Continuous Deployment (CD)

on:
  push:
    branches: [ master ]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  CD-Deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
  
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Execute Cloud Infra Deployment
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve -lock-timeout=10m

      - name: Connect to AKS Cluster
        uses: azure/aks-set-context@v4
        with:
          resource-group: 'rg-cloudmaven-secure'
          cluster-name: 'aks-cloudmaven-cluster'

      - name: Add Helm Repos
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add elastic https://helm.elastic.co
          helm repo add fluent https://fluent.github.io/helm-charts
          helm repo update

      - name: Deploy Prometheus + Grafana
        run: |
          helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
            --namespace monitoring --create-namespace \
            --set grafana.adminPassword=CloudMaven2026! \
            --set alertmanager.enabled=false \
            --wait --timeout 5m

      - name: Deploy Elasticsearch
        run: |
          helm upgrade --install elasticsearch elastic/elasticsearch \
            --namespace logging --create-namespace \
            --set replicas=1 \
            --set minimumMasterNodes=1 \
            --wait --timeout 8m

      - name: Deploy Kibana
        run: |
          helm upgrade --install kibana elastic/kibana \
            --namespace logging \
            --set elasticsearchHosts=http://elasticsearch-master:9200 \
            --wait --timeout 5m

      - name: Deploy FluentBit
        run: |
          helm upgrade --install fluent-bit fluent/fluent-bit \
            --namespace logging \
            --wait --timeout 3m

      - name: Log into Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build & Push Microservices
        run: |
          docker build -f ./app/frontend/Dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/local-frontend:latest ./app/frontend
          docker build -f ./app/backend/Dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/local-backend:latest ./app/backend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/local-frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/local-backend:latest

      - name: Upgrade Application workloads via Helm
        run: |
          helm upgrade --install cloudmaven-app ./helm/myapp \
            --set frontend.image.repository=${{ secrets.DOCKERHUB_USERNAME }}/local-frontend \
            --set backend.image.repository=${{ secrets.DOCKERHUB_USERNAME }}/local-backend \
            --set frontend.image.tag=latest \
            --set backend.image.tag=latest

      - name: Show Access Info
        run: |
          INGRESS_IP=$(kubectl get svc -n ingress-basic ingress-nginx-controller -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "Ingress IP: ${INGRESS_IP}"
          echo "Add this to your hosts file: ${INGRESS_IP} cloudmaven-app.local"
          echo "Then open: http://cloudmaven-app.local/"

      - name: Verify Workload Rollout Status
        run: |
          kubectl rollout status deployment/frontend-deployment --timeout=90s
          kubectl rollout status deployment/backend-deployment --timeout=90s
