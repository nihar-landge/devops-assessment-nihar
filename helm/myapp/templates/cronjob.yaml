apiVersion: batch/v1
kind: CronJob
metadata:
  name: api-ping-cronjob
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: worker
              image: alpine:latest
              command:
                - /bin/sh
                - -c
                - "apk add --no-cache curl && curl -s http://backend-service:5000/health"
          restartPolicy: OnFailure