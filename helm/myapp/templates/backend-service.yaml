apiVersion: v1
kind: Service
metadata:
  name: backend-service
  labels:
    app: backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "5000"
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
      name: http-metrics
      protocol: TCP
  selector:
    app: backend