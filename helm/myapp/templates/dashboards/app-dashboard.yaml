apiVersion: v1
kind: ConfigMap
metadata:
  name: app-dashboard
  labels:
    grafana_dashboard: "1"
data:
  app-stats.json: |-
    {
      "title": "Application Stats",
      "panels": [
        {
          "title": "Request Count",
          "type": "stat",
          "targets": [{ "expr": "api_http_requests_total" }]
        },
        {
          "title": "CPU Usage",
          "type": "timeseries",
          "targets": [{ "expr": "sum(node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate) by (pod)" }]
        }
      ]
    }
